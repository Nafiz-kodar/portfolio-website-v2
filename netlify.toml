# Netlify configuration
# There is no build step — Netlify serves the repository root as-is.

[build]
  publish = "."
  command = ""

# Security headers. These cost nothing on a static site and stop the site
# being framed by someone else or sniffed into the wrong content type.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# These filenames are NOT content-hashed, so an aggressive immutable cache
# would strand visitors on an old photo or an outdated CV. Images get a week;
# the CV revalidates every time so a new upload is picked up immediately.
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/docs/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# content.js and main.js change whenever you edit the site — revalidate them.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
